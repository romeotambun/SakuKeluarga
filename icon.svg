<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient SakuKeluarga Brand -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    
    <!-- Wallet Brand Gradient (Blue to Indigo) -->
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Success Growth Gradient (Emerald Green) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Premium Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Squircle Dashboard Container (Standard PWA App Icon) -->
  <rect width="512" height="512" rx="144" fill="url(#bgGrad)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="6"/>
  
  <!-- Ambient Neon Aura Background -->
  <circle cx="256" cy="270" r="110" fill="#2563eb" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- KELUARGA MOTIF: Atap Rumah Pelindung Anggaran Bulanan -->
  <path d="M120 220 L256 100 L392 220" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)"/>
  
  <!-- FINANSIAL MOTIF: Batang Pertumbuhan Dana Naik dari Dalam Saku -->
  <rect x="185" y="165" width="26" height="60" rx="6" fill="url(#emeraldGrad)" opacity="0.8"/>
  <rect x="225" y="135" width="26" height="90" rx="6" fill="url(#emeraldGrad)"/>
  <path d="M315 175 L345 145 M345 145 H320 M345 145 V170" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- SAKU MOTIF: Badan Utama Kantong Dompet Premium -->
  <path d="M160 225 H352 C370 225, 384 239, 384 257 V365 C384 383, 370 397, 352 397 H160 C142 397, 128 383, 128 365 V257 C128 239, 142 225, 160 225 Z" fill="url(#walletGrad)"/>
  
  <!-- Lipatan Jahitan Kantong Depan -->
  <path d="M128 255 L232 315 C245 323, 267 323, 280 315 L384 255" stroke="rgba(255, 255, 255, 0.25)" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Cincin Badge Keharmonisan Keluarga (Simbol Cinta di Tengah Saku) -->
  <path d="M256 325 C256 325, 216 290, 216 265 C216 248, 229 235, 245 235 C252 235, 254 238, 256 240 C258 238, 260 235, 267 235 C283 235, 296 248, 296 265 C296 290, 256 325, 256 325 Z" fill="url(#goldGrad)"/>
</svg>
